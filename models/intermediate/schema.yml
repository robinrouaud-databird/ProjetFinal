
version: 2

models:
    - name: int_localbike_staffs
      description: "KPIs and insights on staffs"
      columns:
          - name: staff_id
            description: "Unique ID of the staff"
            tests:
                - unique
                - not_null
          - name: first_name
            description: "First name of staff"
          - name: last_name
            description: "Last name of staff"
          - name: store_id
            description: "ID of the store when the order was created"
            tests:
                - not_null
          - name: manager_id
            description: "ID of the manager of staff"
          - name: total_revenue_staff
            description: "Total revenue generated by staff"
          - name: volume_sales_staff
            description: "Volume of sales generated by staff"

    - name: int_localbike_orders
      description: "KPIs and insights on orders"
      columns:
          - name: order_id
            description: "Unique ID of the product"
            tests:
                - unique
                - not_null
          - name: total_amount_order
            description: "Total amount of the order"
          - name: customer_id
            description: "ID of the customer who ordered"
            tests:
                - not_null
          - name: order_status
            description: "Status of the order"
          - name: order_created_at
            description: "Date when the order was created"
          - name: store_id
            description: "ID of the store when the order was created"
            tests:
                - not_null
          - name: staff_id
            description: "ID of the staff who completed the order"
            tests:
                - not_null

    - name: int_localbike_products
      description: "KPIs and insights on products"
      columns:
          - name: product_id
            description: "Unique ID of the order"
            tests:
                - unique
                - not_null
          - name: model_year
            description: "Model Year of the product"
          - name: total_revenue_product
            description: "Revenue of the product"
          - name: total_discount_product
            description: "Total of the discounts of the product in the orders"
          - name: total_revenue_entreprise
            description: "Total of the revenue of the company"
          - name: volume_sales
            description: "Total volume of products sold by the company"
    
    - name: int_localbike_brands
      description: "KPIs and insights on brands"
      columns:
          - name: brand_id
            description: "Unique ID of the brand"
            tests:
                - unique
                - not_null
          - name: total_revenue_brand
            description: "TotalRevenue of the brand"